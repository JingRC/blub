<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>秒答</title>
  <style>
    /* 视觉跟着桌宠走：深蓝底 + 青绿点缀（跟字幕条 .meeting-bar 同一套色），
       因为这张卡就是"贴在鲸鱼旁边的一块补充信息"。 */
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    body {
      font: 12px/1.55 "Microsoft YaHei", system-ui, "Segoe UI", sans-serif;
      color: #dbe9ff;
    }
    .card {
      display: flex;
      flex-direction: column;
      height: 100vh;
      border-radius: 12px;
      background: rgba(8, 26, 46, 0.95);
      border: 1px solid rgba(127, 255, 212, 0.5);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    /* 头部既是标题栏也是拖拽区（不用 -webkit-app-region 就没法挪窗口） */
    .head {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px 6px 10px;
      background: rgba(127, 255, 212, 0.12);
      -webkit-app-region: drag;
    }
    .head .tag {
      font-weight: 700;
      font-size: 11px;
      color: #7fffd4;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }
    .head .room {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      color: #eaf3ff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .head .close {
      -webkit-app-region: no-drag;
      flex: none;
      width: 20px;
      height: 20px;
      line-height: 18px;
      text-align: center;
      border-radius: 6px;
      border: 1px solid rgba(127, 255, 212, 0.35);
      background: transparent;
      color: #9fe8d0;
      font-size: 12px;
      cursor: pointer;
    }
    .head .close:hover { background: rgba(127, 255, 212, 0.18); color: #eafff7; }

    .body {
      flex: 1;
      min-height: 0;
      padding: 8px 10px 6px;
      overflow-y: auto;
      user-select: text;      /* 答案要能选中复制（会上要照着念） */
    }
    /* 真正的内容层：**高度只由文字决定**（block 不会被 flex 拉高），
       量它才能算出"这张卡到底需要多高"——直接量 .body 的 scrollHeight 是不行的，
       .body 撑满窗口，量出来永远等于当前窗口高度，卡片就永远不会伸缩。 */
    #inner {
      white-space: pre-wrap;
      word-break: break-word;
    }
    .busy { color: #9fe8d0; }
    .err { color: #ffb3b3; }

    .foot {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px 6px;
      border-top: 1px solid rgba(127, 255, 212, 0.16);
      font-size: 10px;
      color: #8fb3d9;
    }
    .foot .src { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .foot .ms { flex: none; color: #6f92b8; }

    /* 查资料时转个圈，省得主人以为没反应 */
    .spin {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 4px;
      border: 1.5px solid rgba(127, 255, 212, 0.4);
      border-top-color: #7fffd4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: -1px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <span class="tag">💡 秒答</span>
      <span class="room" id="room">等同事提问…</span>
      <button class="close" id="close" title="关闭（关了就不会再挡着你）">✕</button>
    </div>
    <div class="body" id="body"><div id="inner">点一下鲸鱼菜单里的 💡 秒答，我就用最近的旁听原文去查。</div></div>
    <div class="foot">
      <span class="src" id="src"></span>
      <span class="ms" id="ms"></span>
    </div>
  </div>
  <script src="ask-card.js"></script>
</body>
</html>
