<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>鲸鱼看家 · 已锁定</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      /* hidden 属性必须真的隐藏。作者样式里的 display:flex 会压过浏览器默认的 [hidden]{display:none}，
         之前 #farewell（告别动画）就是这么一直盖在锁屏上面的：人还没露脸就喊"终于等到主人啦"，
         下面的蓝底、台词、密码框全被挡住，时长也一直是模板里的"一会儿"。 */
      [hidden] { display: none !important; }
      html, body { height: 100%; overflow: hidden; }
      body {
        background: radial-gradient(circle at 50% 40%, #102a45 0%, #081625 55%, #04090f 100%);
        color: #dbe9ff;
        font: 15px/1.6 "Microsoft YaHei", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        cursor: default;
        transition: background 0.6s ease;
      }
      /* 认出"别人"时整屏泛红发威 */
      body[data-mood="stranger"] {
        background: radial-gradient(circle at 50% 40%, #3d1220 0%, #1b0a12 55%, #0a0406 100%);
      }
      /* 认出主人：整屏转绿，跟"蓝色=主人不见了"形成明确对照。
         这是"确认到主人"那一刻的绿（连续两眼命中、真的开门），3 分钟以内的告别不播。 */
      body[data-mood="owner"] {
        background: radial-gradient(circle at 50% 40%, #0d3a3a 0%, #081e28 55%, #04090f 100%);
      }
      /* 认出但还没确认（连续两眼才算数）：底色仍然保持蓝的、只是亮一点、鲸鱼探头看仔细些。
         绿底留给确认那一刻——免得"好像是你"就先喊"找到主人啦"。 */
      body[data-mood="confirming"] {
        background: radial-gradient(circle at 50% 40%, #16385c 0%, #0a1c30 55%, #04090f 100%);
      }
      body[data-mood="confirming"] .whale { animation: peek 1.3s ease-in-out infinite; }
      @keyframes peek {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-7px) scale(1.04); }
      }
      body.shake-screen { animation: shakeScreen 0.5s ease-in-out; }
      @keyframes shakeScreen {
        0%, 100% { transform: translate(0, 0); }
        20% { transform: translate(-6px, 2px); }
        40% { transform: translate(6px, -2px); }
        60% { transform: translate(-4px, 1px); }
        80% { transform: translate(4px, -1px); }
      }

      /* 海底气泡：一直往上冒，像个水缸 */
      .bubbles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .bubbles i {
        position: absolute;
        bottom: -40px;
        width: 12px; height: 12px;
        border-radius: 50%;
        border: 1px solid rgba(127, 180, 255, 0.35);
        background: rgba(127, 180, 255, 0.08);
        animation: floatUp linear infinite;
      }
      @keyframes floatUp {
        0% { transform: translateY(0) scale(0.8); opacity: 0; }
        15% { opacity: 0.9; }
        100% { transform: translateY(-105vh) scale(1.15); opacity: 0; }
      }

      .clock {
        font: 200 74px/1 "Segoe UI", system-ui, sans-serif;
        letter-spacing: 3px;
        color: #eaf4ff;
        text-shadow: 0 0 30px rgba(127, 180, 255, 0.35);
      }
      .date { font-size: 14px; color: #7fa6cf; margin-top: 6px; letter-spacing: 1px; }

      /* ---- 鲸鱼 ---- */
      .whale {
        margin: 22px 0 6px;
        animation: bob 3.4s ease-in-out infinite;
        transform-origin: 50% 80%;
      }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      body[data-mood="stranger"] .whale { animation: angryShake 0.28s ease-in-out infinite; }
      @keyframes angryShake {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        25% { transform: translate(-3px, 1px) rotate(-2deg); }
        75% { transform: translate(3px, -1px) rotate(2deg); }
      }
      body[data-mood="owner"] .whale { animation: happyJump 0.6s ease-in-out 3; }
      @keyframes happyJump {
        0%, 100% { transform: translateY(0) scale(1); }
        45% { transform: translateY(-22px) scale(1.06); }
      }
      /* 呼吸/状态部件按心情显隐 */
      .eye-angry, .mouth-frown, .mouth-o, .brows, .steam, .zzz { display: none; }
      body[data-mood="stranger"] .eye-normal,
      body[data-mood="stranger"] .mouth-normal { display: none; }
      body[data-mood="stranger"] .eye-angry,
      body[data-mood="stranger"] .brows,
      body[data-mood="stranger"] .steam,
      body[data-mood="stranger"] .mouth-frown { display: block; }
      body[data-mood="noFace"] .mouth-normal { display: none; }
      body[data-mood="noFace"] .mouth-o { display: block; }
      body[data-mood="noFace"] .zzz { display: block; }
      body[data-mood="stranger"] .blush { fill: #ff5a6e; opacity: 0.9; }

      .steam { animation: steamUp 1s ease-out infinite; }
      @keyframes steamUp {
        0% { opacity: 0; transform: translateY(4px); }
        40% { opacity: 1; }
        100% { opacity: 0; transform: translateY(-14px); }
      }

      /* ---- 台词气泡 ---- */
      .say {
        position: relative;
        margin-top: 6px;
        max-width: 520px;
        padding: 12px 18px;
        border-radius: 14px;
        background: rgba(10, 28, 52, 0.9);
        border: 1px solid rgba(127, 180, 255, 0.4);
        font-size: 16px;
        color: #cfe3ff;
        text-align: center;
        transition: border-color 0.3s ease, color 0.3s ease;
      }
      .say::after {
        content: "";
        position: absolute;
        top: -8px; left: 50%;
        width: 14px; height: 14px;
        margin-left: -7px;
        background: inherit;
        border-left: 1px solid rgba(127, 180, 255, 0.4);
        border-top: 1px solid rgba(127, 180, 255, 0.4);
        transform: rotate(45deg);
      }
      body[data-mood="stranger"] .say {
        border-color: rgba(255, 110, 130, 0.75);
        color: #ffd2d8;
        background: rgba(58, 14, 24, 0.92);
        font-weight: 700;
        font-size: 19px;
      }
      body[data-mood="owner"] .say { border-color: rgba(127, 255, 212, 0.75); color: #b6ffe8; }

      .title { margin-top: 14px; font-size: 15px; font-weight: 700; color: #9fd0ff; letter-spacing: 1px; }
      .sub { font-size: 12.5px; color: #6f89a8; margin-top: 4px; }

      .box {
        margin-top: 20px;
        width: 360px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .pw-row { display: flex; gap: 8px; width: 100%; }
      input[type="password"] {
        flex: 1;
        padding: 11px 14px;
        border-radius: 10px;
        border: 1px solid rgba(127, 180, 255, 0.4);
        background: rgba(8, 22, 38, 0.9);
        color: #eaf4ff;
        font: 15px/1 "Microsoft YaHei", system-ui, sans-serif;
        outline: none;
      }
      input[type="password"]:focus { border-color: #7fffd4; box-shadow: 0 0 0 3px rgba(127, 255, 212, 0.15); }
      button {
        border: 0; border-radius: 10px; cursor: pointer;
        padding: 11px 20px;
        font: 700 14px/1 "Microsoft YaHei", system-ui, sans-serif;
        color: #08243d;
        background: linear-gradient(135deg, #7fffd4, #7fb4ff);
      }
      button:hover { filter: brightness(1.08); }
      button.ghost {
        background: rgba(127, 180, 255, 0.12);
        color: #bcd6f5;
        border: 1px solid rgba(127, 180, 255, 0.35);
        font-weight: 400;
        padding: 7px 14px;
        font-size: 12px;
      }

      .msg { min-height: 20px; font-size: 13px; color: #ffb3b3; text-align: center; }
      .face {
        display: flex; align-items: center; gap: 8px;
        font-size: 12.5px; color: #7fa6cf;
        margin-top: 4px;
      }
      .dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #7fffd4;
        box-shadow: 0 0 8px rgba(127, 255, 212, 0.8);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

      .hint {
        position: fixed; bottom: 18px; left: 0; right: 0;
        text-align: center; font-size: 11.5px; color: #4d6584;
      }
      .shake { animation: shake 0.35s ease-in-out; }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-8px); }
        75% { transform: translateX(8px); }
      }

      /* ---- 刷脸解锁：终于等到主人（开心告别动画） ---- */
      .farewell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: radial-gradient(circle at 50% 40%, #0d3a3a 0%, #081e28 55%, #04090f 100%);
        z-index: 50;
        animation: farewellIn 0.45s ease-out;
      }
      @keyframes farewellIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
      .farewell-line1 {
        font-size: 30px;
        font-weight: 700;
        color: #b6ffe8;
        letter-spacing: 1px;
        animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      @keyframes popIn { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
      .farewell-line2 {
        font-size: 17px;
        color: #cfe3ff;
        animation: popIn 0.6s 0.15s backwards cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .farewell-line2 b { color: #7fffd4; font-size: 21px; padding: 0 3px; }
      /* 撒欢的星星 */
      .farewell .sparkles span {
        position: absolute;
        font-size: 22px;
        animation: sparkleUp 1.6s ease-out infinite;
      }
      @keyframes sparkleUp {
        0% { opacity: 0; transform: translateY(20px) scale(0.6); }
        35% { opacity: 1; }
        100% { opacity: 0; transform: translateY(-70px) scale(1.15); }
      }
    </style>
  </head>
  <body data-mood="waiting">
    <div class="bubbles" id="bubbles"></div>

    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>

    <svg class="whale" width="132" height="132" viewBox="0 0 120 120">
      <ellipse cx="60" cy="96" rx="42" ry="8" fill="rgba(0,0,0,0.35)" />
      <path d="M60 30 Q65 20 70 25" stroke="#4d8fc7" stroke-width="3" fill="none" stroke-linecap="round" />
      <rect x="8" y="52" width="18" height="10" rx="2" fill="#3f7fb5" />
      <rect x="4" y="46" width="10" height="8" rx="2" fill="#3f7fb5" />
      <rect x="4" y="64" width="10" height="8" rx="2" fill="#3f7fb5" />
      <rect x="50" y="32" width="12" height="14" rx="2" fill="#3f7fb5" />
      <rect x="20" y="46" width="80" height="32" rx="8" fill="#4a92cf" />
      <rect x="32" y="66" width="56" height="10" rx="5" fill="#8fc3ea" />
      <rect x="66" y="80" width="20" height="10" rx="4" fill="#3f7fb5" />
      <rect x="36" y="82" width="14" height="12" rx="4" fill="#3f7fb5" />
      <rect x="70" y="80" width="14" height="14" rx="4" fill="#3f7fb5" />
      <ellipse class="blush" cx="42" cy="70" rx="7" ry="5" fill="#e88ba6" opacity="0.75" />
      <ellipse class="blush" cx="78" cy="69" rx="5" ry="4" fill="#e88ba6" opacity="0.75" />

      <!-- 正常眼睛 -->
      <g class="eye-normal">
        <circle cx="48" cy="58" r="7" fill="#fff" />
        <circle cx="48" cy="58" r="4.5" fill="#16324f" />
        <circle cx="46" cy="56" r="2" fill="#fff" />
        <circle cx="72" cy="59" r="6" fill="#fff" />
        <circle cx="72" cy="59" r="3.5" fill="#16324f" />
        <circle cx="70" cy="57" r="1.5" fill="#fff" />
      </g>
      <!-- 生气眼睛（眯起来瞪人） -->
      <g class="eye-angry" stroke="#16324f" stroke-width="3.4" stroke-linecap="round">
        <path d="M41 59 L55 55" />
        <path d="M66 55 L79 60" />
      </g>
      <!-- 怒眉 -->
      <g class="brows" stroke="#0f2740" stroke-width="3.6" stroke-linecap="round">
        <path d="M40 48 L56 54" />
        <path d="M80 48 L65 54" />
      </g>
      <!-- 头顶怒气 -->
      <g class="steam" fill="#ff8095">
        <circle cx="30" cy="26" r="4" />
        <circle cx="22" cy="18" r="3" />
        <circle cx="90" cy="26" r="4" />
        <circle cx="98" cy="18" r="3" />
      </g>
      <!-- 打呼的 Z（没人时无聊到睡着） -->
      <g class="zzz" fill="#8fc3ea" font-family="system-ui, sans-serif" font-weight="700">
        <text x="92" y="26" font-size="14">Z</text>
        <text x="103" y="14" font-size="10">z</text>
      </g>

      <ellipse class="mouth-normal" cx="60" cy="68" rx="3" ry="4" fill="#16324f" />
      <path class="mouth-frown" d="M52 72 Q60 66 68 72" stroke="#16324f" stroke-width="3" fill="none" stroke-linecap="round" />
      <ellipse class="mouth-o" cx="60" cy="69" rx="4" ry="5" fill="#16324f" />
    </svg>

    <div class="say" id="say">主人你什么时候回来呀～我在这儿等着呢</div>
    <div class="title">🔒 鲸鱼在看家，屏幕已锁定</div>
    <div class="sub" id="sub">主人离开了一段时间，鲸鱼把电脑守起来了</div>

    <div class="box">
      <div class="pw-row">
        <input id="pw" type="password" placeholder="输入密码解锁" autocomplete="off" />
        <button id="unlockBtn">解锁</button>
      </div>
      <div class="msg" id="msg"></div>
      <div class="face">
        <span class="dot"></span>
        <span id="faceStatus">摄像头识别中… 回到镜头前会自动解锁</span>
      </div>
      <button class="ghost" id="focusBtn">键盘没反应？点这里重新聚焦</button>
    </div>

    <div class="hint">忘记密码：删除 data/lock.json 可解除应用锁屏（不会删除认主信息）</div>

    <!-- 刷脸解锁的开心告别（默认隐藏，认出主人时由 lock.js 显示） -->
    <div class="farewell" id="farewell" hidden>
      <svg class="whale" width="176" height="176" viewBox="0 0 120 120">
        <ellipse cx="60" cy="96" rx="42" ry="8" fill="rgba(0,0,0,0.3)" />
        <path d="M60 30 Q65 18 72 23" stroke="#4d8fc7" stroke-width="3" fill="none" stroke-linecap="round" />
        <rect x="8" y="52" width="18" height="10" rx="2" fill="#3f7fb5" />
        <rect x="4" y="46" width="10" height="8" rx="2" fill="#3f7fb5" />
        <rect x="4" y="64" width="10" height="8" rx="2" fill="#3f7fb5" />
        <rect x="50" y="32" width="12" height="14" rx="2" fill="#3f7fb5" />
        <rect x="20" y="46" width="80" height="32" rx="8" fill="#4a92cf" />
        <rect x="32" y="66" width="56" height="10" rx="5" fill="#8fc3ea" />
        <rect x="66" y="80" width="20" height="10" rx="4" fill="#3f7fb5" />
        <rect x="36" y="82" width="14" height="12" rx="4" fill="#3f7fb5" />
        <rect x="70" y="80" width="14" height="14" rx="4" fill="#3f7fb5" />
        <ellipse cx="42" cy="70" rx="8" ry="5.5" fill="#e88ba6" opacity="0.9" />
        <ellipse cx="78" cy="69" rx="6" ry="4.5" fill="#e88ba6" opacity="0.9" />
        <!-- 笑成月牙的眼睛 -->
        <path d="M41 59 Q48 51 55 59" stroke="#16324f" stroke-width="3.4" fill="none" stroke-linecap="round" />
        <path d="M66 59 Q72 52 79 60" stroke="#16324f" stroke-width="3.4" fill="none" stroke-linecap="round" />
        <!-- 张开笑的嘴 -->
        <path d="M50 68 Q60 79 70 68 Z" fill="#16324f" />
      </svg>
      <div class="farewell-line1">🎉 终于等到主人啦～</div>
      <div class="farewell-line2">小鲸鱼给你看家护院了 <b id="farewellDur">一会儿</b></div>
      <div class="sparkles" id="sparkles"></div>
    </div>

    <script src="lock.js"></script>
  </body>
</html>
