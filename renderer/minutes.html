<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>会议记录</title>
    <style>
      /* hidden 属性必须真的隐藏：作者样式里的 display（如 .modal{display:flex}）会压过
         浏览器默认的 [hidden]{display:none}。踩过一次：小弹窗（重命名/确认删除）虽然带着
         hidden 却一直显示，还因为 position:fixed;inset:0 把整个窗口的点击都挡住了，
         看起来就是"这个界面点了没反应"。pet.css 与 lock.html 里都有同一条，别再漏。 */
      [hidden] { display: none !important; }

      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: linear-gradient(160deg, #0b1622 0%, #0e2238 60%, #0b1622 100%);
        color: #dbe9ff;
        font: 12.5px/1.7 "Microsoft YaHei", system-ui, sans-serif;
      }
      .app { display: flex; gap: 12px; height: 100%; padding: 12px 14px 14px; box-sizing: border-box; }

      /* ---- 左边：历次会议列表 ---- */
      .side {
        flex: 0 0 236px;
        display: flex;
        flex-direction: column;
        border-radius: 12px;
        background: rgba(12, 30, 56, 0.72);
        border: 1px solid rgba(127, 180, 255, 0.22);
        overflow: hidden;
      }
      .side-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 9px 10px 7px;
        border-bottom: 1px solid rgba(127, 180, 255, 0.18);
        font: 700 12.5px/1.3 "Microsoft YaHei", system-ui, sans-serif;
        color: #9fd0ff;
      }
      .side-count { color: #6f89a8; font-size: 10.5px; font-weight: 400; }
      .side-list { flex: 1; overflow-y: auto; padding: 6px; }
      .side-foot { padding: 6px 10px 8px; color: #6f89a8; font-size: 10px; border-top: 1px solid rgba(127, 180, 255, 0.14); }
      .m-item {
        padding: 7px 9px;
        border-radius: 9px;
        border: 1px solid transparent;
        cursor: pointer;
        margin-bottom: 4px;
      }
      .m-item:hover { background: rgba(127, 180, 255, 0.1); }
      .m-item.on { background: rgba(127, 255, 212, 0.1); border-color: rgba(127, 255, 212, 0.45); }
      .m-item-title { color: #eaf4ff; font-weight: 700; font-size: 11.5px; overflow-wrap: anywhere; }
      .m-item-meta { color: #8aa8cc; font-size: 10px; margin-top: 2px; }
      .m-item-warn { color: #ffd479; font-size: 10px; }

      /* ---- 右边：正文 ---- */
      .main {
        flex: 1;
        min-width: 0;      /* 少了它，长标题/长文件名会把整列撑出窗口 */
        max-width: 920px;  /* 窗口拉得很宽时也别让正文横跨一屏，读起来费劲 */
        overflow-y: auto;
        overflow-x: hidden;
      }
      /* 按钮单独占一行：窗口窄的时候它们会自己换行，绝不会被右边缘裁掉 */
      .head { display: block; }
      .title { font: 700 16px/1.35 "Microsoft YaHei", system-ui, sans-serif; color: #9fd0ff; overflow-wrap: anywhere; }
      .meta { color: #6f89a8; font-size: 11px; margin-top: 3px; overflow-wrap: anywhere; }
      .actions { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
      button {
        border: 1px solid rgba(127, 180, 255, 0.4);
        background: rgba(127, 180, 255, 0.12);
        color: #dbe9ff;
        font: 11.5px/1.4 "Microsoft YaHei", system-ui, sans-serif;
        border-radius: 8px;
        padding: 5px 9px;
        cursor: pointer;
      }
      button:hover { background: rgba(127, 180, 255, 0.25); }
      button.primary { border-color: #7fffd4; color: #7fffd4; background: rgba(127, 255, 212, 0.12); }
      button.danger:hover { background: rgba(255, 120, 120, 0.22); border-color: rgba(255, 120, 120, 0.7); color: #ffb3b3; }
      button:disabled { opacity: 0.45; cursor: default; }

      .card {
        margin-top: 10px;
        padding: 11px 13px;
        border-radius: 12px;
        background: rgba(12, 30, 56, 0.9);
        border: 1px solid rgba(127, 180, 255, 0.25);
      }
      .body h1 { font-size: 17px; color: #9fd0ff; margin: 0 0 8px; }
      .body h2 { font-size: 13.5px; color: #7fffd4; margin: 15px 0 6px; border-bottom: 1px solid rgba(127, 255, 212, 0.2); padding-bottom: 4px; }
      .body h3 { font-size: 12.5px; color: #bfe0ff; margin: 11px 0 4px; }
      .body ul { margin: 4px 0 4px 2px; padding-left: 18px; }
      .body li { margin: 3px 0; }
      .body blockquote { margin: 6px 0; padding: 6px 10px; border-left: 3px solid rgba(127, 180, 255, 0.5); background: rgba(127, 180, 255, 0.07); color: #a9c6e8; }
      .body b, .body strong { color: #ffffff; }
      .body code { background: rgba(255, 255, 255, 0.08); padding: 1px 4px; border-radius: 4px; }
      .warn { color: #ffd479; }
      .ask-row { display: flex; gap: 6px; margin-top: 9px; }
      .ask-row input {
        flex: 1;
        min-width: 0;
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid rgba(127, 180, 255, 0.4);
        background: rgba(8, 22, 38, 0.9);
        color: #eaf4ff;
        font: 12px/1.4 "Microsoft YaHei", system-ui, sans-serif;
        outline: none;
      }
      .ask-row input:focus { border-color: #7fffd4; }
      .ask-row input:disabled { opacity: 0.55; }
      .answer { margin-top: 9px; padding: 8px 10px; border-radius: 8px; background: rgba(127, 255, 212, 0.08); border: 1px solid rgba(127, 255, 212, 0.25); white-space: pre-wrap; }
      .empty { color: #6f89a8; padding: 12px 0; max-width: 640px; }
      .hint { color: #6f89a8; font-size: 11px; margin-top: 7px; }

      /* ---- 小弹窗（重命名 / 确认删除）---- */
      .modal { position: fixed; inset: 0; background: rgba(4, 12, 24, 0.62); display: flex; align-items: center; justify-content: center; z-index: 50; }
      .modal-box {
        width: 380px;
        padding: 14px 16px 12px;
        border-radius: 12px;
        background: rgba(12, 30, 56, 0.98);
        border: 1px solid rgba(127, 180, 255, 0.4);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      }
      .modal-title { font: 700 13px/1.4 "Microsoft YaHei", system-ui, sans-serif; color: #9fd0ff; margin-bottom: 8px; }
      .modal-body { color: #dbe9ff; font-size: 12px; }
      .modal-body input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 8px;
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid rgba(127, 180, 255, 0.4);
        background: rgba(8, 22, 38, 0.9);
        color: #eaf4ff;
        font: 12px/1.4 "Microsoft YaHei", system-ui, sans-serif;
        outline: none;
      }
      .modal-body input:focus { border-color: #7fffd4; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="side-head"><span>🎧 会议记录</span><span class="side-count" id="mtCount">0 场</span></div>
        <div class="side-list" id="mtList"></div>
        <div class="side-foot" id="mtSideFoot">纪要存在本机 data/meetings/</div>
      </aside>
      <main class="main">
        <div class="head">
          <div>
            <div class="title" id="mtTitle">📝 会议纪要</div>
            <div class="meta" id="mtMeta">加载中…</div>
          </div>
          <div class="actions">
            <button id="mtRename">✏️ 重命名</button>
            <button id="mtCopy">复制全文</button>
            <button id="mtFolder">文件夹</button>
            <button id="mtOpen" class="primary">打开</button>
            <button id="mtDelete" class="danger">🗑 删除</button>
          </div>
        </div>
        <div class="card body" id="mtBody"><div class="empty">加载中…</div></div>
        <div class="card">
          <div class="meta">对这场会追问（只依据纪要和原文回答，答不上来会直说）</div>
          <div class="ask-row">
            <input id="mtAskInput" type="text" placeholder="比如：客户最后确认的报价是多少？谁负责改合同？" />
            <button id="mtAskBtn" class="primary">问一句</button>
          </div>
          <div class="answer" id="mtAnswer" hidden></div>
          <div class="hint">纪要就是本机 data/meetings/ 下的 md 文件，可以随便复制、改、发给同事；"附：原文时间轴"能逐句核对记对没有。</div>
        </div>
      </main>
    </div>

    <div class="modal" id="mtModal" hidden>
      <div class="modal-box">
        <div class="modal-title" id="mtModalTitle"></div>
        <div class="modal-body" id="mtModalBody"></div>
        <div class="modal-actions">
          <button id="mtModalCancel">取消</button>
          <button id="mtModalOk" class="primary">确定</button>
        </div>
      </div>
    </div>
    <script src="minutes.js"></script>
  </body>
</html>
