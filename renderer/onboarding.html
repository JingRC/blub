<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>鲸鱼认主</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: linear-gradient(160deg, #0b1622 0%, #0e2238 60%, #0b1622 100%);
        color: #dbe9ff;
        font: 14px/1.6 "Microsoft YaHei", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 20px;
        user-select: none;
      }
      h1 { font-size: 18px; color: #9fd0ff; margin-bottom: 4px; }
      .sub { font-size: 12px; color: #6f89a8; margin-bottom: 16px; }
      .preview-wrap {
        position: relative;
        width: 320px;
        height: 240px;
        border-radius: 14px;
        overflow: hidden;
        border: 2px solid rgba(127, 180, 255, 0.4);
        background: #06101f;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
      .countdown {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        font: 700 72px/1 system-ui, sans-serif; color: #7fffd4;
        text-shadow: 0 0 24px rgba(127, 255, 212, 0.7);
        background: rgba(4, 14, 30, 0.35);
        visibility: hidden;
      }
      .countdown.show { visibility: visible; }
      .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      .flash.go { animation: shutter 0.35s ease-out; }
      @keyframes shutter { 0% { opacity: 0.9; } 100% { opacity: 0; } }
      .steps { display: flex; gap: 10px; margin: 16px 0 12px; }
      .dot {
        width: 34px; height: 8px; border-radius: 4px;
        background: rgba(127, 180, 255, 0.2);
        border: 1px solid rgba(127, 180, 255, 0.35);
        transition: all 0.3s;
      }
      .dot.done { background: #7fffd4; border-color: #7fffd4; box-shadow: 0 0 8px rgba(127, 255, 212, 0.6); }
      .dot.now { background: #ffd27f; border-color: #ffd27f; }
      #status { min-height: 22px; font-size: 13px; color: #cfe0ff; margin-bottom: 12px; text-align: center; }
      #mainBtn {
        border: 0; border-radius: 999px; cursor: pointer;
        padding: 10px 34px;
        font: 700 15px/1 "Microsoft YaHei", system-ui, sans-serif;
        color: #08243d;
        background: linear-gradient(135deg, #7fffd4, #7fb4ff);
        box-shadow: 0 4px 16px rgba(127, 180, 255, 0.4);
        transition: transform 0.15s, box-shadow 0.15s;
      }
      #mainBtn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(127, 180, 255, 0.55); }
      #mainBtn:disabled { opacity: 0.5; cursor: default; }
      .skip {
        margin-top: 14px; font-size: 12px; color: #6f89a8; cursor: pointer;
        text-decoration: underline; background: none; border: 0;
      }
      .skip:hover { color: #9fd0ff; }
    </style>
  </head>
  <body>
    <h1>🐋 鲸鱼认主</h1>
    <div class="sub">拍摄 3 张你的照片，以后鲸鱼只认你一个人；主人不在时它会替你看家</div>
    <div class="preview-wrap">
      <video id="video" autoplay muted playsinline></video>
      <div id="countdown" class="countdown">3</div>
      <div id="flash" class="flash"></div>
    </div>
    <div class="steps">
      <div id="dot0" class="dot"></div>
      <div id="dot1" class="dot"></div>
      <div id="dot2" class="dot"></div>
    </div>
    <div id="status">请正对镜头，光线充足效果更好</div>
    <button id="mainBtn">开始认主</button>
    <button id="skipBtn" class="skip">暂不认主，稍后可从 心情 → 认主登记 进入</button>

    <script src="onboarding.js"></script>
  </body>
</html>
