<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>心情设置</title>
    <link rel="stylesheet" href="pet.css" />
    <style>
      /* 独立窗口：不透明背景 + 可滚动（pet.css 里是按透明桌宠窗口设的） */
      html, body {
        background: linear-gradient(160deg, #0b1622 0%, #0e2238 60%, #0b1622 100%);
        overflow: auto;
      }
      body { padding: 14px 16px 20px; }
      .win-title {
        font: 700 15px/1.3 "Microsoft YaHei", system-ui, sans-serif;
        color: #9fd0ff;
        margin-bottom: 2px;
      }
      .win-sub {
        font: 11px/1.5 "Microsoft YaHei", system-ui, sans-serif;
        color: #6f89a8;
        margin-bottom: 10px;
      }
      .win-col { max-width: 420px; margin: 0 auto; }
    </style>
  </head>
  <body>
    <div class="win-col">
      <div class="win-title">⚙ 心情设置</div>
      <div class="win-sub">识别、认主、锁屏都在这里改；改完立即生效，不用重启桌宠</div>
      <div id="settingsCards"></div>
    </div>
    <script src="outfit.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
